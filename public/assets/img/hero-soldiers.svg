<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="xMaxYMax slice">
  <!-- PromoTrack banner art: drawn for this project, no third-party image. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2613"/>
      <stop offset="0.45" stop-color="#3d4c25"/>
      <stop offset="0.78" stop-color="#8a7a3a"/>
      <stop offset="1" stop-color="#d7a94c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe7a3" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#f3c25e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f3c25e" stop-opacity="0"/>
    </radialGradient>

    <!-- Standing soldier, rifle on the shoulder. 40 x 100 box. -->
    <symbol id="soldier" viewBox="0 0 40 100">
      <path d="M11 13.5 Q11 3.5 20 3.5 Q29 3.5 29 13.5 Z"/>
      <rect x="8.5" y="11.6" width="23" height="2.8" rx="1.3"/>
      <ellipse cx="20" cy="17.5" rx="5" ry="5.6"/>
      <rect x="17" y="21" width="6" height="4"/>
      <path d="M10 24.5 Q20 21.5 30 24.5 L33 27 L34.5 50 L31 51 L29.6 34 L29 56 L29.5 96 L22.5 96 L21 62 L19 62 L17.5 96 L10.5 96 L11 56 L10.4 34 L9 51 L5.5 50 L7 27 Z"/>
      <rect x="9.6" y="94.5" width="9" height="4.5" rx="1.2"/>
      <rect x="21.4" y="94.5" width="9" height="4.5" rx="1.2"/>
      <path d="M31.2 31 L36 2.5 L37.8 2.9 L33.4 31.6 Z"/>
    </symbol>

    <!-- Saluting soldier. -->
    <symbol id="saluting" viewBox="0 0 40 100">
      <path d="M11 13.5 Q11 3.5 20 3.5 Q29 3.5 29 13.5 Z"/>
      <rect x="8.5" y="11.6" width="23" height="2.8" rx="1.3"/>
      <ellipse cx="20" cy="17.5" rx="5" ry="5.6"/>
      <rect x="17" y="21" width="6" height="4"/>
      <path d="M10 24.5 Q20 21.5 30 24.5 L33 27 L34.5 50 L31 51 L29.6 34 L29 56 L29.5 96 L22.5 96 L21 62 L19 62 L17.5 96 L10.5 96 L11 56 L10.6 31 Z"/>
      <path d="M11.5 25 L3 22.5 L11.8 12.6 L14.6 14.6 L8.4 21.4 L12.5 28 Z"/>
      <rect x="9.6" y="94.5" width="9" height="4.5" rx="1.2"/>
      <rect x="21.4" y="94.5" width="9" height="4.5" rx="1.2"/>
    </symbol>
  </defs>

  <!-- No sky rectangle: the page paints the sky (and hero-ground.svg the
       flat horizon) across the full width, so the scene sits on it without
       a seam at its left edge. -->
  <circle cx="1010" cy="250" r="190" fill="url(#sun)"/>

  <!-- Helicopter -->
  <g fill="#0a2410" opacity="0.85" transform="translate(770 58)">
    <rect x="-38" y="-6" width="96" height="2.4" rx="1"/>
    <rect x="9" y="-5" width="2.4" height="8"/>
    <path d="M-6 3 Q10 -1 26 4 Q34 8 30 16 L-4 16 Q-12 12 -6 3 Z"/>
    <path d="M26 7 L70 5 L72 8 L28 13 Z"/>
    <rect x="68" y="-2" width="2" height="14" rx="1"/>
    <rect x="-6" y="19" width="34" height="2" rx="1"/>
  </g>

  <!-- Distant hills -->
  <path d="M0 236 L120 236 C220 236 260 224 360 224 C520 224 560 238 700 236 C860 234 900 220 1020 222 C1100 224 1150 230 1200 230 V300 H0 Z" fill="#1b4a20"/>

  <!-- Flag -->
  <g transform="translate(1088 92)">
    <rect x="0" y="0" width="4" height="190" fill="#120f0a"/>
    <circle cx="2" cy="-2" r="4" fill="#d4a73c"/>
    <path d="M4 6 Q34 0 62 8 Q86 14 104 8 L104 58 Q86 64 62 58 Q34 50 4 56 Z" fill="#0038a8"/>
    <path d="M4 31 Q34 25 62 33 Q86 39 104 33 L104 58 Q86 64 62 58 Q34 50 4 56 Z" fill="#ce1126"/>
    <path d="M4 6 L46 31 L4 56 Z" fill="#ffffff"/>
    <circle cx="18" cy="31" r="6" fill="#fcd116"/>
  </g>

  <!-- Ground -->
  <path d="M0 278 L200 278 C400 278 500 272 700 272 C900 272 1000 276 1200 274 V300 H0 Z" fill="#082410"/>

  <!-- Soldiers -->
  <g fill="#082410">
    <use href="#soldier" x="690" y="168" width="44" height="110"/>
    <use href="#soldier" x="742" y="160" width="48" height="118"/>
    <use href="#soldier" x="800" y="150" width="52" height="128"/>
    <use href="#saluting" x="864" y="138" width="58" height="142"/>
    <use href="#soldier" x="934" y="150" width="52" height="128"/>
    <use href="#soldier" x="994" y="160" width="48" height="118"/>
    <use href="#soldier" x="1140" y="170" width="44" height="108"/>
  </g>
</svg>
